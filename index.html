<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英語やるぞ！</title>
<meta name="description" content="英検の単語プリント・文法プリントの音読ページ">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D1095A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英語やるぞ！">
<style>
:root{
  --bg:#F2F4F8; --card:#ffffff; --ink:#1F2733; --sub:#64748B;
  --line:#DCE3EC; --accent:#D1095A; --accent2:#F03E0C;
  --star:#F6A609;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --card:#1A202A; --ink:#E8EDF4; --sub:#9AA7B8;
    --line:#2A3340;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",
    system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:0 16px calc(40px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;}
.wrap{max-width:560px;margin:0 auto;}

/* ---- ヘッダー ---- */
header{margin:0 -16px 18px;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;
  background:radial-gradient(110% 120% at 18% 8%, #FF7A18 0%, rgba(255,122,24,0) 52%),
             linear-gradient(140deg,#F03E0C 0%,#D1095A 60%,#96005A 100%);
  color:#fff;}
.hrow{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.logo{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);
  border:1.5px solid rgba(255,255,255,.45);display:flex;align-items:center;
  justify-content:center;font-size:25px;font-weight:900;line-height:1;padding-bottom:2px;}
.htxt{flex:1 1 auto;min-width:0;}
h1{font-size:1.24rem;margin:0;letter-spacing:.5px;font-weight:800;}
.hello{font-size:.82rem;opacity:.92;margin-top:3px;}
.hello button{background:none;border:none;color:#fff;opacity:.8;font:inherit;
  text-decoration:underline;padding:0 0 0 8px;cursor:pointer;}

/* ---- 級カード ---- */
.sec{font-size:.78rem;font-weight:700;color:var(--sub);margin:0 2px 7px;
  letter-spacing:.08em;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:13px 14px 14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);}
.card.fav{border-color:var(--star);box-shadow:0 2px 10px rgba(246,166,9,.18);}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.badge{flex:0 0 auto;color:#fff;font-weight:800;font-size:.95rem;
  padding:5px 14px;border-radius:9px;}
.favmark{font-size:.72rem;font-weight:700;color:var(--star);}
.star{margin-left:auto;background:none;border:none;font-size:1.5rem;line-height:1;
  cursor:pointer;padding:2px 2px;color:#C8D1DC;transition:transform .12s;}
.star[aria-pressed="true"]{color:var(--star);}
.star:active{transform:scale(.86);}
.btns{display:flex;gap:9px;}
.b{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;border-radius:11px;padding:11px 8px 12px;color:#fff;
  font-weight:700;font-size:1rem;}
.b small{font-size:.7rem;font-weight:600;opacity:.85;}
.b:active{filter:brightness(.92);}
.b.tango{background:#2B6CB0;} .b.bunpo{background:#2F855A;}

/* ---- 名前入力 ---- */
.mask{position:fixed;inset:0;background:rgba(14,19,26,.62);display:none;
  align-items:center;justify-content:center;padding:22px;z-index:20;}
.mask.on{display:flex;}
.modal{background:var(--card);border-radius:18px;padding:22px 20px 20px;
  width:100%;max-width:340px;text-align:center;}
.modal .mi{font-size:36px;line-height:1;}
.modal h2{font-size:1.08rem;margin:10px 0 4px;}
.modal p{font-size:.84rem;color:var(--sub);margin:0 0 14px;line-height:1.6;}
.modal input{width:100%;font:inherit;font-size:1.05rem;text-align:center;
  padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--bg);color:var(--ink);}
.modal input:focus{outline:none;border-color:var(--accent);}
.modal .go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:1rem;
  color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));
  border:none;border-radius:11px;padding:12px;cursor:pointer;}
.modal .go:disabled{opacity:.45;}

.note{font-size:.78rem;color:var(--sub);line-height:1.8;margin:16px 2px 0;}
.note b{color:var(--ink);}
</style>
</head>
<body>

<header><div class="hrow">
  <div class="logo">英</div>
  <div class="htxt">
    <h1>英語やるぞ！</h1>
    <div class="hello" id="hello"></div>
  </div>
</div></header>

<div class="wrap">
  <div class="sec" id="sec1" hidden>★ お気に入り</div>
  <div id="favbox"></div>
  <div class="sec" id="sec2">級をえらぶ</div>
  <div id="list"></div>

  <p class="note">
    プリントの右上にあるQRコードを読みとると、その回のページが直接ひらきます。<br>
    英文をタップすると、その文だけ読み上げます。<br>
    <b>★</b>をおすと、その級がいちばん上に出てくるようになります。
  </p>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="mi">👋</div>
  <h2>名前をおしえてね</h2>
  <p>この端末にだけ保存されます。<br>あとから変えられます。</p>
  <input id="nm" type="text" maxlength="12" placeholder="なまえ"
         autocomplete="off" enterkeyhint="done">
  <button class="go" id="go" disabled>はじめる</button>
</div></div>

<script>
var LEVELS = [
  {id:"5",  name:"英検5級",  color:"#1A365D", t:"t5.html",  g:"g5.html"},
  {id:"4",  name:"英検4級",  color:"#115E59", t:"t4.html",  g:"g4.html"},
  {id:"3",  name:"英検3級",  color:"#9F1239", t:"t3.html",  g:"g3.html"},
  {id:"p2", name:"英検準2級", color:"#7C2D12", t:"tp2.html", g:"gp2.html"},
  {id:"2",  name:"英検2級",  color:"#4C1D95", t:"t2.html",  g:"g2.html"}
];
var KN = "yaruzo.name", KF = "yaruzo.fav";

function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var favs = (function(){
  var raw = get(KF);
  if(!raw) return [];
  try{ var a = JSON.parse(raw); return Array.isArray(a) ? a : []; }catch(e){ return []; }
})();

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function cardHTML(L){
  var on = favs.indexOf(L.id) >= 0;
  return '<div class="card' + (on ? ' fav' : '') + '">' +
    '<div class="ctop">' +
      '<span class="badge" style="background:' + L.color + '">' + L.name + '</span>' +
      (on ? '<span class="favmark">お気に入り</span>' : '') +
      '<button class="star" data-id="' + L.id + '" aria-pressed="' + on + '" ' +
        'aria-label="' + L.name + 'をお気に入りにする">' + (on ? '★' : '☆') + '</button>' +
    '</div><div class="btns">' +
      '<a class="b tango" href="' + L.t + '">単語<small>音読ページ</small></a>' +
      '<a class="b bunpo" href="' + L.g + '">文法<small>音読ページ</small></a>' +
    '</div></div>';
}

function draw(){
  var fav = LEVELS.filter(function(L){ return favs.indexOf(L.id) >= 0; });
  var rest = LEVELS.filter(function(L){ return favs.indexOf(L.id) < 0; });
  document.getElementById("sec1").hidden = fav.length === 0;
  document.getElementById("favbox").innerHTML = fav.map(cardHTML).join("");
  document.getElementById("sec2").hidden = rest.length === 0;
  document.getElementById("list").innerHTML = rest.map(cardHTML).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".star"), function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-id"), i = favs.indexOf(id);
      if(i >= 0){ favs.splice(i,1); } else { favs.unshift(id); }
      set(KF, JSON.stringify(favs));
      draw();
    });
  });
}

function hello(){
  var n = get(KN);
  document.getElementById("hello").innerHTML = n
    ? esc(n) + " さん、きょうもやるぞ！<button id='rn'>名前を変える</button>"
    : "";
  var r = document.getElementById("rn");
  if(r) r.addEventListener("click", function(){ ask(get(KN) || ""); });
}

var mask = document.getElementById("mask"),
    nm = document.getElementById("nm"),
    go = document.getElementById("go");

function ask(cur){
  nm.value = cur || "";
  go.disabled = !nm.value.trim();
  mask.classList.add("on");
  setTimeout(function(){ nm.focus(); }, 60);
}
nm.addEventListener("input", function(){ go.disabled = !nm.value.trim(); });
nm.addEventListener("keydown", function(e){
  if(e.key === "Enter" && nm.value.trim()) go.click();
});
go.addEventListener("click", function(){
  var v = nm.value.trim();
  if(!v) return;
  set(KN, v);
  mask.classList.remove("on");
  hello();
});

draw();
hello();
if(!get(KN)) ask("");

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
